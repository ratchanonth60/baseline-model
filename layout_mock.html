<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSSD Analysis Suite - Refined Ribbon</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Custom Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        window: '#1e1e1e',     // VS Code-like Dark
                        ribbonBg: '#2b2d31',   // Slightly lighter for toolbar
                        panel: '#252526',      // Sidebars/Panels
                        activeTab: '#2b2d31',  // Match ribbonBg
                        inactiveTab: '#1e1e1e',
                        border: '#3e3e42',     // Subtle borders
                        primary: '#007acc',    // VS Code Blue
                        accent: '#4ec9b0',     // Teal
                        textMain: '#cccccc',
                        textMuted: '#858585'
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'ribbon': '0 2px 5px rgba(0,0,0,0.2)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #424242; border-radius: 5px; border: 2px solid #1e1e1e; }
        ::-webkit-scrollbar-thumb:hover { background: #4f4f4f; }

        /* Ribbon Styles */
        .ribbon-container {
            background-color: #2b2d31;
            border-bottom: 1px solid #3e3e42;
        }

        .ribbon-tab {
            padding: 6px 16px;
            font-size: 13px;
            cursor: pointer;
            color: #cccccc;
            border-top: 1px solid transparent;
            border-left: 1px solid transparent;
            border-right: 1px solid transparent;
            transition: all 0.1s;
        }
        
        .ribbon-tab:hover:not(.active) {
            background-color: #35373b;
            color: white;
        }

        .ribbon-tab.active {
            background-color: #2b2d31; /* Same as ribbon body */
            color: white;
            border-left: 1px solid #3e3e42;
            border-right: 1px solid #3e3e42;
            border-top: 2px solid #007acc; /* Active indicator */
            font-weight: 500;
            position: relative;
            z-index: 10;
            margin-bottom: -1px; /* Cover bottom border */
        }

        /* Ribbon Toolbar */
        .ribbon-toolbar {
            height: 90px;
            display: flex;
            padding: 4px 8px;
            gap: 4px;
        }

        .ribbon-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 8px;
            border-right: 1px solid #3e3e42;
            height: 100%;
            position: relative;
        }
        
        .ribbon-group:last-child { border-right: none; }

        .ribbon-group-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .ribbon-label {
            font-size: 11px;
            color: #858585;
            margin-top: 2px;
            margin-bottom: 2px;
        }

        /* Buttons */
        .btn-large {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 56px;
            border-radius: 3px;
            color: #cccccc;
            gap: 4px;
        }
        .btn-large:hover { background-color: #3e3e42; color: white; }
        .btn-large i { font-size: 20px; }
        .btn-large span { font-size: 11px; }

        .btn-small-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .btn-small {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            color: #cccccc;
            text-align: left;
            width: 100%;
        }
        .btn-small:hover { background-color: #3e3e42; color: white; }
        
        /* Chart Card */
        .chart-card {
            background-color: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #cccccc;
        }

        /* Inputs */
        .ribbon-input {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            color: white;
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-window text-textMain h-screen flex flex-col overflow-hidden select-none">

    <!-- 1. Window Title (VS Code Style) -->
    <div class="h-8 bg-[#1e1e1e] flex items-center justify-between px-3 text-[12px] border-b border-[#3e3e42]">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-chart-simple text-primary"></i>
            <span>DSSD Analysis Suite</span>
        </div>
        <div class="flex gap-2 text-textMuted">
            <span>Workspace: Default</span>
        </div>
    </div>

    <!-- 2. Ribbon Area -->
    <div class="ribbon-container shadow-ribbon z-20">
        <!-- Tab Strip -->
        <div class="flex px-2 bg-[#1e1e1e] pt-1">
            <div onclick="switchTab('baseline')" id="tab-baseline" class="ribbon-tab active">Baseline</div>
            <div onclick="switchTab('observation')" id="tab-observation" class="ribbon-tab">Observation</div>
            <div onclick="switchTab('settings')" id="tab-settings" class="ribbon-tab">Settings</div>
        </div>

        <!-- Toolbars -->
        <div class="relative">
            <!-- TOOLBAR: BASELINE -->
            <div id="toolbar-baseline" class="ribbon-toolbar">
                <!-- Group 1: File -->
                <div class="ribbon-group min-w-[120px]">
                    <div class="ribbon-group-content">
                        <button onclick="document.getElementById('fileInput').click()" class="btn-large">
                            <i class="fa-regular fa-folder-open text-yellow-500"></i>
                            <span>Open</span>
                        </button>
                        <div class="btn-small-row">
                             <button class="btn-small"><i class="fa-solid fa-file-export text-blue-400"></i> Export</button>
                             <button class="btn-small"><i class="fa-solid fa-print text-textMuted"></i> Report</button>
                        </div>
                    </div>
                    <span class="ribbon-label">File</span>
                </div>

                <!-- Group 2: Parameters -->
                <div class="ribbon-group">
                    <div class="ribbon-group-content items-start justify-center flex-col px-2 gap-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] w-12 text-right">Delay:</span>
                            <input type="number" value="0" class="ribbon-input w-16">
                            <span class="text-[10px] text-textMuted">μs</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] w-12 text-right">Thresh:</span>
                            <input type="number" value="1.5" class="ribbon-input w-16">
                            <span class="text-[10px] text-textMuted">mV</span>
                        </div>
                    </div>
                    <span class="ribbon-label">Parameters</span>
                </div>

                <!-- Group 3: Fitting -->
                <div class="ribbon-group">
                    <div class="ribbon-group-content flex-col items-start justify-center px-2 gap-1">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" checked class="accent-primary">
                            <span class="text-[11px]">Gaussian Fit</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="accent-accent">
                            <span class="text-[11px]">HEMG Single</span>
                        </label>
                    </div>
                    <span class="ribbon-label">Fitting</span>
                </div>

                <!-- Group 4: Analysis -->
                <div class="ribbon-group">
                    <div class="ribbon-group-content">
                        <button onclick="startAnalysis()" id="btn-start" class="btn-large">
                            <i class="fa-solid fa-play text-green-500"></i>
                            <span>Start</span>
                        </button>
                        <button class="btn-large">
                            <i class="fa-solid fa-stop text-red-500"></i>
                            <span>Stop</span>
                        </button>
                         <button onclick="showHeatmap()" class="btn-large">
                            <i class="fa-solid fa-border-all text-accent"></i>
                            <span>Map</span>
                        </button>
                    </div>
                    <span class="ribbon-label">Action</span>
                </div>
            </div>

            <!-- TOOLBAR: OBSERVATION -->
            <div id="toolbar-observation" class="ribbon-toolbar hidden">
                <div class="ribbon-group">
                    <div class="ribbon-group-content">
                        <button onclick="startAnalysis()" class="btn-large">
                            <i class="fa-solid fa-satellite-dish text-green-400"></i>
                            <span>Live</span>
                        </button>
                        <div class="flex flex-col justify-center px-2">
                            <div class="text-[10px] text-textMuted">STATUS</div>
                            <div class="text-sm font-bold text-green-400">ACTIVE</div>
                        </div>
                    </div>
                    <span class="ribbon-label">Monitor</span>
                </div>
                <div class="ribbon-group">
                     <div class="ribbon-group-content flex-col justify-center px-2">
                         <div class="flex items-center gap-2">
                             <span class="text-[11px]">DSSD Layer:</span>
                             <select class="ribbon-input"><option>L1</option><option>L2</option></select>
                         </div>
                     </div>
                     <span class="ribbon-label">View</span>
                </div>
            </div>

            <!-- TOOLBAR: SETTINGS -->
            <div id="toolbar-settings" class="ribbon-toolbar hidden">
                <div class="ribbon-group">
                    <div class="ribbon-group-content">
                        <button class="btn-large">
                            <i class="fa-solid fa-swatchbook text-accent"></i>
                            <span>Theme</span>
                        </button>
                    </div>
                    <span class="ribbon-label">Appearance</span>
                </div>
            </div>
        </div>
        
        <!-- Bottom border of ribbon -->
        <div class="h-[1px] bg-[#1e1e1e]"></div>
    </div>

    <!-- 3. Main Content -->
    <main class="flex-1 bg-window relative overflow-hidden flex">
        
        <!-- BASELINE VIEW -->
        <div id="view-baseline" class="flex-1 flex flex-col h-full">
            <!-- Workspace Toolbar -->
            <div class="h-8 bg-[#252526] border-b border-[#3e3e42] flex items-center px-4 gap-4">
                <button class="text-[11px] font-semibold text-white border-b-2 border-primary h-full">Histogram Grid</button>
                <button class="text-[11px] font-semibold text-textMuted hover:text-white h-full transition-colors">Data Table</button>
                <div class="flex-1"></div>
                <span class="text-[10px] text-textMuted" id="file-info">No file loaded</span>
            </div>

            <!-- Scrollable Grid -->
            <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="charts-grid">
                    <!-- JS Injected Charts -->
                </div>
            </div>
        </div>

        <!-- OBSERVATION VIEW -->
        <div id="view-observation" class="flex-1 flex flex-col h-full hidden p-3 gap-3">
             <div class="flex-1 bg-[#252526] border border-[#3e3e42] rounded p-3 relative">
                 <div class="absolute top-3 left-3 z-10 bg-black/50 px-2 py-1 rounded text-xs text-white border border-white/20">Pulse Height X</div>
                 <canvas id="obsChartX"></canvas>
             </div>
             <div class="flex-1 bg-[#252526] border border-[#3e3e42] rounded p-3 relative">
                 <div class="absolute top-3 left-3 z-10 bg-black/50 px-2 py-1 rounded text-xs text-white border border-white/20">Pulse Height Y</div>
                 <canvas id="obsChartY"></canvas>
             </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="view-settings" class="flex-1 hidden items-center justify-center">
            <div class="text-textMuted">Settings Panel Placeholder</div>
        </div>

        <input type="file" id="fileInput" class="hidden" onchange="document.getElementById('file-info').innerText = this.files[0].name">
    </main>

    <!-- 4. Status Bar -->
    <footer class="h-6 bg-[#007acc] text-white flex items-center justify-between px-3 text-[11px] select-none z-50">
        <div class="flex items-center gap-4">
            <span id="status-text"><i class="fa-solid fa-check-circle mr-1"></i>Ready</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="w-32 h-2 bg-black/20 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-white/80 w-0"></div>
            </div>
            <span id="clock">00:00:00</span>
        </div>
    </footer>

    <!-- Heatmap Modal -->
    <div id="heatmap-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 transition-opacity duration-200">
        <div class="bg-[#252526] border border-[#3e3e42] w-[500px] shadow-2xl rounded-lg overflow-hidden transform scale-95 transition-transform" id="heatmap-content">
            <div class="bg-[#1e1e1e] p-2 flex justify-between items-center border-b border-[#3e3e42]">
                <span class="text-xs font-bold pl-2">Coincidence Heatmap</span>
                <button onclick="hideHeatmap()" class="w-6 h-6 hover:bg-[#3e3e42] rounded flex items-center justify-center"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-4">
                <div id="heatmap-grid" class="grid grid-cols-8 gap-[1px] bg-[#3e3e42] border border-[#3e3e42]"></div>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script>
        // --- Navigation ---
        function switchTab(mode) {
            document.querySelectorAll('.ribbon-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.ribbon-toolbar').forEach(t => t.classList.add('hidden'));
            
            document.getElementById(`tab-${mode}`).classList.add('active');
            document.getElementById(`toolbar-${mode}`).classList.remove('hidden');

            document.getElementById('view-baseline').classList.add('hidden');
            document.getElementById('view-observation').classList.add('hidden');
            document.getElementById('view-settings').classList.add('hidden');
            
            document.getElementById(`view-${mode}`).classList.remove('hidden');

            // Resize charts
            if (mode === 'observation') {
                setTimeout(() => { obsChartX.resize(); obsChartY.resize(); }, 10);
            }
        }

        // --- Init Charts ---
        const chartInstances = [];
        setTimeout(() => {
            const grid = document.getElementById('charts-grid');
            for(let i=1; i<=8; i++) {
                const div = document.createElement('div');
                div.className = 'chart-card h-40';
                div.innerHTML = `
                    <div class="chart-header">
                        <span>CH ${i}</span>
                        <span class="text-[#007acc]" id="stats-${i}">-</span>
                    </div>
                    <div class="flex-1 relative"><canvas id="chart-${i}"></canvas></div>
                `;
                grid.appendChild(div);
                
                const ctx = div.querySelector('canvas').getContext('2d');
                chartInstances.push(new Chart(ctx, {
                    type: 'bar',
                    data: { labels: Array(20).fill(''), datasets: [{ data: Array(20).fill(0), backgroundColor: '#007acc', borderRadius: 1 }] },
                    options: { 
                        responsive: true, maintainAspectRatio: false, 
                        plugins: { legend: { display: false } },
                        scales: { x: { display: false }, y: { display: false, grid: { color: '#333' } } }
                    }
                }));
            }
        }, 100);

        // --- Live Charts ---
        let obsChartX, obsChartY;
        window.onload = () => {
             const commonOptions = {
                 responsive: true, maintainAspectRatio: false,
                 plugins: { legend: { display: false } },
                 scales: { x: { display: false }, y: { grid: { color: '#333' } } },
                 animation: false,
                 elements: { point: { radius: 0 } }
             };
             
             obsChartX = new Chart(document.getElementById('obsChartX'), {
                 type: 'line',
                 data: { labels: Array(50).fill(''), datasets: [{ data: Array(50).fill(0), borderColor: '#007acc', borderWidth: 1 }] },
                 options: commonOptions
             });
             
             obsChartY = new Chart(document.getElementById('obsChartY'), {
                 type: 'line',
                 data: { labels: Array(50).fill(''), datasets: [{ data: Array(50).fill(0), borderColor: '#4ec9b0', borderWidth: 1 }] },
                 options: commonOptions
             });
        }

        // --- Fake Analysis ---
        let running = false;
        function startAnalysis() {
            if (running) return;
            running = true;
            document.getElementById('status-text').innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Processing...';
            
            let p = 0;
            const interval = setInterval(() => {
                p += 2;
                document.getElementById('progress-bar').style.width = p + '%';
                
                // Update Baseline Charts
                chartInstances.forEach(c => {
                    if(Math.random() > 0.8) {
                        const d = c.data.datasets[0].data;
                        d[Math.floor(Math.random()*20)] += 5;
                        c.update('none');
                    }
                });

                // Update Obs Charts
                if (obsChartX) {
                    const d = obsChartX.data.datasets[0].data;
                    d.shift(); d.push(Math.random() * 100);
                    obsChartX.update('none');
                }

                if(p >= 100) {
                    clearInterval(interval);
                    running = false;
                    document.getElementById('status-text').innerHTML = '<i class="fa-solid fa-check mr-1"></i> Done';
                    document.getElementById('progress-bar').style.width = '0%';
                }
            }, 50);
        }

        // --- Heatmap ---
        function showHeatmap() {
            const modal = document.getElementById('heatmap-modal');
            const grid = document.getElementById('heatmap-grid');
            grid.innerHTML = '';
            for(let i=0; i<64; i++) {
                const d = document.createElement('div');
                const v = Math.random();
                d.style.backgroundColor = `rgba(0, 122, 204, ${v})`;
                d.className = 'w-full h-12 hover:border border-white cursor-crosshair';
                d.title = `Val: ${(v*100).toFixed(0)}`;
                grid.appendChild(d);
            }
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modal.querySelector('div').classList.remove('scale-95'); }, 10);
        }
        function hideHeatmap() {
             const modal = document.getElementById('heatmap-modal');
             modal.classList.add('opacity-0');
             modal.querySelector('div').classList.add('scale-95');
             setTimeout(() => modal.classList.add('hidden'), 200);
        }

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
